<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Sensor Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

  <h1>🌡 Temperature/Humidity Live View</h1>
  <h2>   View your home's temperature and humidity in real-time</h2>
  <div id="status">Connecting...</div>

  <div class="cards">
    <div class="card">
      <div class="icon">🌡️</div>
      <div class="label">Temperature</div>
      <div class="value" id="temp">0.00</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="icon">💧</div>
      <div class="label">Humidity</div>
      <div class="value" id="humidity">0.00</div>
      <div class="unit">% RH</div>
    </div>
   <div class="card">
      <div class="icon" id="weather-icon">🌤️</div>
      <div class="label">Weather Forecast</div>
      <div class="value" id="forecast"></div>
      <div class="unit"></div>
    </div>
    <div class="card">
     <div class="icon">💨</div>
      <div class="label">Wind Speed</div>
      <div class="value" id="wind">--</div>
      <div class="unit">km/h</div>
    </div>
  <div id="chart-container">
   <div class="chart-header">TEMPERATURE HISTORY</div>
   <canvas id="tempChart"></canvas>
   <div class="chart-stats">
    <div><span class="stat-label">MIN</span><span id="tempMin">--</span></div>
    <div><span class="stat-label">AVG</span><span id="tempAvg">--</span></div>
    <div><span class="stat-label">MAX</span><span id="tempMax">--</span></div>
  </div> 
</div>

  <div id="log">
    <h2>LATEST DATA</h2>
    <ul id="log-list"></ul>
  </div>

  <script>
    const ws = new WebSocket('ws://localhost:3000');
    const status = document.getElementById('status');

    ws.onopen = () => {
      status.textContent = '● Connected';
      status.className = 'connected';
    };

    ws.onclose = () => {
      status.textContent = '● Disconnected';
      status.className = '';
    };
    // Temperature history chart setup
    const tempHistory = [];
    const timeLabels = [];

    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: timeLabels,
        datasets: [{
          label: 'Temperature °C',
          data: tempHistory,
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0,212,255,0.08)',
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#00d4ff',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#888', font: { size: 10 }, maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.03)' } },
          y: { ticks: { color: '#888', font: { size: 10 }, callback: v => v + '°C' }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
  });

    ws.onmessage = (event) => 
    {
      const { topic, data } = JSON.parse(event.data);

      // Update cards based on topic
      if (topic.includes('temp')) {
        document.getElementById('temp').textContent = parseFloat(data).toFixed(1);
        // Add to chart
        const time = new Date().toLocaleTimeString();
        tempHistory.push(parseFloat(data));
        timeLabels.push(time);

        // Keep only last 20 readings
        if (tempHistory.length > 20) {
          tempHistory.shift();
          timeLabels.shift();
        }

        // Update min avg max
        const min = Math.min(...tempHistory).toFixed(1);
        const max = Math.max(...tempHistory).toFixed(1);
        const avg = (tempHistory.reduce((a, b) => a + b, 0) / tempHistory.length).toFixed(1);

        document.getElementById('tempMin').textContent = min + '°C';
        document.getElementById('tempAvg').textContent = avg + '°C';
        document.getElementById('tempMax').textContent = max + '°C';

        tempChart.update();
      }
      if (topic.includes('rh')) {
        document.getElementById('humidity').textContent = parseFloat(data).toFixed(1);
      }
      if (topic === 'weather/forecast') {
      const weather = JSON.parse(data);
      
      const code = weather.weathercode;
      let icon = '☀️';
      
      if (code === 0) icon = '☀️';
      else if (code <= 3) icon = '🌤️';
      else if (code <= 48) icon = '🌫️';
      else if (code <= 55) icon = '🌦️';
      else if (code <= 65) icon = '🌧️';
      else if (code <= 75) icon = '🌨️';
      else if (code <= 82) icon = '🌧️';
      else if (code <= 99) icon = '⛈️';

      document.getElementById('forecast').textContent = weather.temperature_2m + '°C';
      document.getElementById('weather-icon').textContent = icon;
      document.getElementById('forecast').textContent = weather.temperature_2m + '°C';
      document.getElementById('weather-icon').textContent = icon;
      document.getElementById('wind').textContent = weather.windspeed_10m;
      }

    // Add to log
      const li = document.createElement('li');
      const time = new Date().toLocaleTimeString();

      if (topic === 'weather/forecast') {
        const weather = JSON.parse(data);
        li.textContent = `[${time}] 🌤️ Kingston: ${weather.temperature_2m}°C, Humidity: ${weather.relative_humidity_2m}%`;
      } else {
        li.textContent = `[${time}] ${topic}: ${data}`;
      }

      const logList = document.getElementById('log-list');
      logList.insertBefore(li, logList.firstChild);
    };
  </script>

</body>
</html>
